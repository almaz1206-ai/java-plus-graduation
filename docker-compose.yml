services:
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.7.1}
    restart: unless-stopped
    ports: ["${KAFKA_HOST_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      start_period: 20s
      timeout: 10s
      interval: 5s
      retries: 12

  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:3.7.1}
    depends_on:
      kafka: {condition: service_healthy}
    restart: "no"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      USER_ACTIONS_TOPIC: stats.user-actions.v1
      EVENTS_SIMILARITY_TOPIC: stats.events-similarity.v1
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_TOPIC_REPLICATION_FACTOR: 1
    command:
      - /bin/bash
      - -c
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server "$${KAFKA_BOOTSTRAP_SERVERS}" \
          --create --if-not-exists \
          --topic "$${USER_ACTIONS_TOPIC}" \
          --partitions "$${KAFKA_TOPIC_PARTITIONS}" \
          --replication-factor "$${KAFKA_TOPIC_REPLICATION_FACTOR}"
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server "$${KAFKA_BOOTSTRAP_SERVERS}" \
          --create --if-not-exists \
          --topic "$${EVENTS_SIMILARITY_TOPIC}" \
          --partitions "$${KAFKA_TOPIC_PARTITIONS}" \
          --replication-factor "$${KAFKA_TOPIC_REPLICATION_FACTOR}"

  collector:
    build: ewm-stats-service/collector
    image: collector
    restart: unless-stopped
    depends_on:
      discovery-server: {condition: service_healthy}
      config-server: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      USER_ACTIONS_TOPIC: stats.user-actions.v1
      COLLECTOR_HTTP_PORT: 9191
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9191'"]
      start_period: 30s
      timeout: 3s
      interval: 5s
      retries: 18

  aggregator:
    build: ewm-stats-service/aggregator
    image: aggregator
    restart: unless-stopped
    depends_on:
      discovery-server: {condition: service_healthy}
      config-server: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      USER_ACTIONS_TOPIC: stats.user-actions.v1
      EVENTS_SIMILARITY_TOPIC: stats.events-similarity.v1
      AGGREGATOR_KAFKA_GROUP_ID: stats-aggregator-v1
      AGGREGATOR_HTTP_PORT: 9192
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9192'"]
      start_period: 30s
      timeout: 3s
      interval: 5s
      retries: 18

  analyzer:
    build: ewm-stats-service/analyzer
    image: analyzer
    restart: unless-stopped
    depends_on:
      discovery-server: {condition: service_healthy}
      config-server: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      analyzer-db: {condition: service_healthy}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://analyzer-db:5432/analyzer
      SPRING_DATASOURCE_USERNAME: analyzer
      SPRING_DATASOURCE_PASSWORD: ${ANALYZER_DB_PASSWORD:-analyzer}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      USER_ACTIONS_TOPIC: stats.user-actions.v1
      EVENTS_SIMILARITY_TOPIC: stats.events-similarity.v1
      ANALYZER_USER_ACTIONS_GROUP: analyzer-user-actions-v1
      ANALYZER_SIMILARITY_GROUP: analyzer-similarity-v1
      ANALYZER_HTTP_PORT: 9193
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9193'"]
      start_period: 40s
      timeout: 3s
      interval: 5s
      retries: 24

  discovery-server:
    build: infra/discovery-server
    image: discovery-server
    restart: unless-stopped
    ports: ["8761:8761"]
    healthcheck: &infra-health
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8761'"]
      start_period: 20s
      timeout: 3s
      interval: 5s
      retries: 12

  config-server:
    build: infra/config-server
    image: config-server
    restart: unless-stopped
    ports: ["8888:8888"]
    depends_on:
      discovery-server: {condition: service_healthy}
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8888'"]
      start_period: 20s
      timeout: 3s
      interval: 5s
      retries: 12

  gateway-server:
    build: infra/gateway-server
    image: gateway-server
    restart: unless-stopped
    ports: ["8080:8080"]
    depends_on:
      discovery-server: {condition: service_healthy}
      config-server: {condition: service_healthy}
      user-service: {condition: service_healthy}
      category-service: {condition: service_healthy}
      event-service: {condition: service_healthy}
      request-service: {condition: service_healthy}
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      start_period: 30s
      timeout: 3s
      interval: 5s
      retries: 18

  user-service:
    build: core/user-service
    image: user-service
    restart: unless-stopped
    depends_on:
      discovery-server: {condition: service_healthy}
      config-server: {condition: service_healthy}
      user-db: {condition: service_healthy}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/users
      SPRING_DATASOURCE_USERNAME: users
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:-users}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
    healthcheck: &user-health
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081'"]
      start_period: 30s
      timeout: 3s
      interval: 5s
      retries: 18

  user-db:
    image: postgres:16.1
    restart: unless-stopped
    ports: ["5434:5432"]
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: users
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-users}
    healthcheck: &db-health
      test: ["CMD-SHELL", "pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      start_period: 20s
      timeout: 5s
      interval: 5s
      retries: 12

  category-service:
    build: core/category-service
    image: category-service
    restart: unless-stopped
    depends_on:
      discovery-server: { condition: service_healthy }
      config-server: { condition: service_healthy }
      user-service: { condition: service_healthy }
      category-db: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://category-db:5432/category
      SPRING_DATASOURCE_USERNAME: category
      SPRING_DATASOURCE_PASSWORD: ${CATEGORY_DB_PASSWORD:-category}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8084'" ]
      start_period: 30s
      timeout: 3s
      interval: 5s
      retries: 18

  category-db:
    image: postgres:16.1
    restart: unless-stopped
    ports: ["5435:5432"]
    environment:
      POSTGRES_DB: category
      POSTGRES_USER: category
      POSTGRES_PASSWORD: ${CATEGORY_DB_PASSWORD:-category}
    healthcheck: *db-health

  analyzer-db:
    image: postgres:16.1
    restart: unless-stopped
    ports: ["5438:5432"]
    environment:
      POSTGRES_DB: analyzer
      POSTGRES_USER: analyzer
      POSTGRES_PASSWORD: ${ANALYZER_DB_PASSWORD:-analyzer}
    healthcheck: *db-health

  event-service:
    build: core/event-service
    image: event-service
    restart: unless-stopped
    depends_on:
      discovery-server: {condition: service_healthy}
      config-server: {condition: service_healthy}
      user-service: {condition: service_healthy}
      category-service: {condition: service_healthy}
      collector: {condition: service_healthy}
      analyzer: {condition: service_healthy}
      event-db: {condition: service_healthy}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://event-db:5432/events
      SPRING_DATASOURCE_USERNAME: events
      SPRING_DATASOURCE_PASSWORD: ${EVENT_DB_PASSWORD:-events}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
    healthcheck: &event-health
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8082'"]
      start_period: 30s
      timeout: 3s
      interval: 5s
      retries: 18

  event-db:
    image: postgres:16.1
    restart: unless-stopped
    ports: ["5436:5432"]
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: events
      POSTGRES_PASSWORD: ${EVENT_DB_PASSWORD:-events}
    healthcheck: *db-health

  request-service:
    build: core/request-service
    image: request-service
    restart: unless-stopped
    depends_on:
      discovery-server: {condition: service_healthy}
      config-server: {condition: service_healthy}
      user-service: {condition: service_healthy}
      event-service: {condition: service_healthy}
      collector: {condition: service_healthy}
      request-db: {condition: service_healthy}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://request-db:5432/requests
      SPRING_DATASOURCE_USERNAME: requests
      SPRING_DATASOURCE_PASSWORD: ${REQUEST_DB_PASSWORD:-requests}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
    healthcheck: &request-health
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8083'"]
      start_period: 30s
      timeout: 3s
      interval: 5s
      retries: 18

  request-db:
    image: postgres:16.1
    restart: unless-stopped
    ports: ["5437:5432"]
    environment:
      POSTGRES_DB: requests
      POSTGRES_USER: requests
      POSTGRES_PASSWORD: ${REQUEST_DB_PASSWORD:-requests}
    healthcheck: *db-health
