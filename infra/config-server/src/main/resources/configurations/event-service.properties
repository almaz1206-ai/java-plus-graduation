server.port=8082
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/events}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:events}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:events}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
spring.cloud.openfeign.client.config.default.connectTimeout=${FEIGN_CONNECT_TIMEOUT_MS:3000}
spring.cloud.openfeign.client.config.default.readTimeout=${FEIGN_READ_TIMEOUT_MS:10000}
spring.cloud.openfeign.client.config.default.loggerLevel=basic
logging.level.ru.practicum=INFO
ewm.event.user-min-hours=${EVENT_USER_MIN_HOURS:2}
ewm.event.admin-min-hours=${EVENT_ADMIN_MIN_HOURS:1}
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.registry-fetch-interval-seconds=5
