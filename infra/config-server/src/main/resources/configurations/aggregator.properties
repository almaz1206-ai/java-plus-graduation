server.port=${AGGREGATOR_HTTP_PORT:9192}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${AGGREGATOR_KAFKA_GROUP_ID:stats-aggregator-v1}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.value-deserializer=ru.practicum.ewm.stats.avro.serialization.UserActionAvroDeserializer
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=ru.practicum.ewm.stats.avro.serialization.AvroSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
aggregator.kafka.user-actions-topic=${USER_ACTIONS_TOPIC:stats.user-actions.v1}
aggregator.kafka.events-similarity-topic=${EVENTS_SIMILARITY_TOPIC:stats.events-similarity.v1}
aggregator.kafka.consumer-group=${AGGREGATOR_KAFKA_GROUP_ID:stats-aggregator-v1}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
logging.level.ru.practicum=INFO

eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.client.instance-info-replication-interval-seconds=5
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.registry-fetch-interval-seconds=5
