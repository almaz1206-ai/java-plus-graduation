server.port=8080
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.access=read-only
management.endpoint.gateway.enabled=true
logging.level.org.springframework.cloud.gateway=INFO
logging.level.ru.practicum=INFO

spring.cloud.gateway.httpclient.connect-timeout=${GATEWAY_CONNECT_TIMEOUT_MS:3000}
spring.cloud.gateway.httpclient.response-timeout=${GATEWAY_RESPONSE_TIMEOUT:10s}

eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.client.instance-info-replication-interval-seconds=5
eureka.client.registry-fetch-interval-seconds=5
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=user-service-api
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/admin/users/**

spring.cloud.gateway.routes[1].id=category-service-api
spring.cloud.gateway.routes[1].uri=lb://category-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/categories/**,/admin/categories/**,/compilations/**,/admin/compilations/**,/comments/**,/admin/comments/**,/users/*/comments/**

spring.cloud.gateway.routes[2].id=request-api
spring.cloud.gateway.routes[2].uri=lb://request-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/users/*/events/*/requests/**,/users/*/requests/**
spring.cloud.gateway.routes[2].filters[0].name=Retry
spring.cloud.gateway.routes[2].filters[0].args.retries=3
spring.cloud.gateway.routes[2].filters[0].args.statuses=SERVICE_UNAVAILABLE
spring.cloud.gateway.routes[2].filters[0].args.methods=GET
spring.cloud.gateway.routes[2].filters[0].args.backoff.firstBackoff=50ms
spring.cloud.gateway.routes[2].filters[0].args.backoff.maxBackoff=500ms
spring.cloud.gateway.routes[2].filters[0].args.backoff.factor=2

spring.cloud.gateway.routes[3].id=event-service-api
spring.cloud.gateway.routes[3].uri=lb://event-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/events/**,/admin/events/**,/users/*/events/**
