server.port=${ANALYZER_HTTP_PORT:9193}
grpc.server.port=0

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5438/analyzer}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:analyzer}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:analyzer}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.properties.isolation.level=read_committed
spring.kafka.listener.ack-mode=manual_immediate
analyzer.kafka.user-actions-topic=${USER_ACTIONS_TOPIC:stats.user-actions.v1}
analyzer.kafka.events-similarity-topic=${EVENTS_SIMILARITY_TOPIC:stats.events-similarity.v1}
analyzer.kafka.user-actions-group=${ANALYZER_USER_ACTIONS_GROUP:analyzer-user-actions-v1}
analyzer.kafka.events-similarity-group=${ANALYZER_SIMILARITY_GROUP:analyzer-similarity-v1}
analyzer.kafka.retry.interval-ms=${ANALYZER_KAFKA_RETRY_INTERVAL_MS:1000}
analyzer.kafka.retry.max-attempts=${ANALYZER_KAFKA_RETRY_MAX_ATTEMPTS:3}
analyzer.recommendations.history-limit=${ANALYZER_RECOMMENDATION_HISTORY_LIMIT:50}
analyzer.recommendations.candidate-limit=${ANALYZER_RECOMMENDATION_CANDIDATE_LIMIT:200}
analyzer.recommendations.neighbor-limit=${ANALYZER_RECOMMENDATION_NEIGHBOR_LIMIT:10}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
logging.level.ru.practicum=INFO

eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.client.instance-info-replication-interval-seconds=5
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.registry-fetch-interval-seconds=5
